<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Baby dragon hatching into the clouds -->
  <defs>
    <linearGradient id="dragonBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FEF9C3"/>
      <stop offset="1" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset="1" stop-color="#BAE6FD"/>
    </linearGradient>
  </defs>

  <!-- sparkle -->
  <path d="M12 10 l1.2 2.6 2.6 1.2 -2.6 1.2 -1.2 2.6 -1.2 -2.6 -2.6 -1.2 2.6 -1.2 Z" fill="#FDE68A" opacity="0.9"/>
  <circle cx="52" cy="12" r="1.4" fill="#FEF9C3" opacity="0.8"/>

  <!-- clouds below -->
  <ellipse cx="16" cy="56" rx="12" ry="5" fill="url(#cloud)" opacity="0.9"/>
  <ellipse cx="46" cy="58" rx="14" ry="5.5" fill="url(#cloud)" opacity="0.85"/>
  <ellipse cx="32" cy="60" rx="10" ry="4.5" fill="#F0F9FF" opacity="0.9"/>

  <!-- wings -->
  <path d="M20 30 Q8 24 6 14 Q16 16 22 24 Z" fill="#A7F3D0" opacity="0.95"/>
  <path d="M44 30 Q56 24 58 14 Q48 16 42 24 Z" fill="#A7F3D0" opacity="0.95"/>

  <!-- tail with ember flame -->
  <path d="M42 44 Q54 44 54 52 Q48 50 44 52 Z" fill="url(#dragonBody)"/>
  <path d="M54 52 Q58 48 57 44 Q60 49 56 54 Z" fill="url(#ember)"/>

  <!-- body -->
  <path d="M20 44 C20 30 25 21 32 21 C39 21 44 30 44 44 Z" fill="url(#dragonBody)"/>
  <!-- belly -->
  <path d="M25 44 C25 33 28 27 32 27 C36 27 39 33 39 44 Z" fill="url(#belly)"/>

  <!-- head -->
  <circle cx="32" cy="20" r="10.5" fill="url(#dragonBody)"/>
  <!-- snout -->
  <ellipse cx="36.5" cy="23.5" rx="4.2" ry="3" fill="#86EFAC"/>
  <!-- nostrils -->
  <circle cx="37.5" cy="22.5" r="0.7" fill="#14532D"/>
  <circle cx="35.2" cy="23.2" r="0.55" fill="#14532D" opacity="0.85"/>

  <!-- eyes (three-quarter view: near eye + far eye hint) -->
  <circle cx="29" cy="19" r="2.7" fill="#14532D"/>
  <circle cx="30" cy="18.1" r="0.85" fill="#ffffff"/>
  <circle cx="36.8" cy="16.2" r="1.6" fill="#14532D"/>
  <circle cx="37.3" cy="15.7" r="0.5" fill="#ffffff"/>

  <!-- cheeks -->
  <ellipse cx="25.5" cy="23" rx="2.5" ry="1.7" fill="#FCA5A5" opacity="0.75"/>
  <ellipse cx="38.5" cy="19.5" rx="2" ry="1.4" fill="#FCA5A5" opacity="0.6"/>

  <!-- horns -->
  <path d="M25 12 L23.5 6.5 L28 10 Z" fill="#FDE68A"/>
  <path d="M39 12 L40.5 6.5 L36 10 Z" fill="#FDE68A"/>

  <!-- back spikes -->
  <path d="M27 12.5 L28.5 8.5 L30.5 12.5 Z" fill="#FDE68A"/>

  <!-- little arms -->
  <path d="M23 36 q-3.2 2 -1.2 4.2 q2.2 -1 3.4 -3.2 Z" fill="#4ADE80"/>
  <path d="M41 36 q3.2 2 1.2 4.2 q-2.2 -1 -3.4 -3.2 Z" fill="#4ADE80"/>

  <!-- feet -->
  <ellipse cx="27" cy="44" rx="3" ry="1.8" fill="#86EFAC"/>
  <ellipse cx="37" cy="44" rx="3" ry="1.8" fill="#86EFAC"/>
</svg>
