<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Talia mascot: a soft peachy blob with blush cheeks -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3EA"/>
      <stop offset="1" stop-color="#FFD1DE"/>
    </linearGradient>
  </defs>
  <!-- flower -->
  <g transform="translate(47,10)">
    <circle r="3" fill="#FF9EB2"/>
    <circle cx="0" cy="-4" r="2.4" fill="#FFB8C6"/>
    <circle cx="3.8" cy="1.2" r="2.4" fill="#FFB8C6"/>
    <circle cx="-3.8" cy="1.2" r="2.4" fill="#FFB8C6"/>
  </g>
  <!-- body -->
  <path d="M8 40 C8 18 20 8 32 8 C44 8 56 18 56 40 L56 46 C56 54 46 58 32 58 C18 58 8 54 8 46 Z" fill="url(#face)"/>
  <!-- eyes -->
  <circle cx="24" cy="34" r="2.6" fill="#573F3A"/>
  <circle cx="40" cy="34" r="2.6" fill="#573F3A"/>
  <!-- blush -->
  <ellipse cx="18" cy="41" rx="4" ry="2.6" fill="#FFB8C6" opacity="0.85"/>
  <ellipse cx="46" cy="41" rx="4" ry="2.6" fill="#FFB8C6" opacity="0.85"/>
  <!-- smile -->
  <path d="M27 42 Q32 47 37 42" stroke="#573F3A" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
