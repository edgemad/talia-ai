<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Baby dino bobbing in the lagoon -->
  <defs>
    <linearGradient id="dinoBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- back splash droplets -->
  <circle cx="14" cy="30" r="1.6" fill="#7DD3FC" opacity="0.85"/>
  <circle cx="50" cy="26" r="1.3" fill="#7DD3FC" opacity="0.7"/>
  <circle cx="54" cy="38" r="1.5" fill="#7DD3FC" opacity="0.8"/>

  <!-- tail -->
  <path d="M42 40 Q54 38 56 46 Q50 44 44 46 Z" fill="url(#dinoBody)"/>

  <!-- body -->
  <path d="M18 42 C18 26 24 16 32 16 C40 16 46 26 46 42 Z" fill="url(#dinoBody)"/>

  <!-- head -->
  <circle cx="32" cy="20" r="10" fill="url(#dinoBody)"/>
  <!-- snout -->
  <ellipse cx="36.5" cy="23.5" rx="4" ry="3" fill="#5EEAD4"/>
  <!-- nostril -->
  <circle cx="38" cy="22.5" r="0.7" fill="#134e4a"/>

  <!-- eye -->
  <circle cx="30" cy="19" r="2.6" fill="#134e4a"/>
  <circle cx="31" cy="18.2" r="0.8" fill="#ffffff"/>

  <!-- cheek -->
  <ellipse cx="26.5" cy="23" rx="2.4" ry="1.6" fill="#99F6E4" opacity="0.9"/>

  <!-- back spikes -->
  <path d="M24 14 L26 10 L28 14 Z" fill="#FBBF24"/>
  <path d="M29 13 L31 9 L33 13 Z" fill="#FBBF24"/>
  <path d="M34 13 L36 10 L38 14 Z" fill="#FBBF24"/>

  <!-- little arms -->
  <path d="M22 34 q-3 2 -1 4 q2 -1 3 -3 Z" fill="#2DD4BF"/>
  <path d="M42 34 q3 2 1 4 q-2 -1 -3 -3 Z" fill="#2DD4BF"/>

  <!-- front wave (in front of body) -->
  <path d="M4 46 Q9 42 14 46 T24 46 T34 46 T44 46 T54 46 T64 46 L64 64 L4 64 Z" fill="url(#water)" opacity="0.85"/>
  <!-- second wave line -->
  <path d="M4 50 Q9 46 14 50 T24 50 T34 50 T44 50 T54 50 T64 50 L64 64 L4 64 Z" fill="#38BDF8" opacity="0.45"/>

  <!-- bubbles -->
  <circle cx="20" cy="54" r="1.6" fill="#ffffff" opacity="0.7"/>
  <circle cx="45" cy="57" r="1.2" fill="#ffffff" opacity="0.6"/>
  <circle cx="33" cy="60" r="1.8" fill="#ffffff" opacity="0.5"/>
</svg>
