name: Desktop installers

on:
  push:
    tags: ["v*"]
    # Also allow a release from a `v*` BRANCH push — used when the release
    # tooling can only push branches (tag pushes go through the same path and
    # produce the identical GitHub release named after the ref).
    branches: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release pipeline at a time: a fix pushed mid-run supersedes the older
# run instead of racing it for the same release assets.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
          - os: windows-latest
            args: "--bundles nsis,msi"
          - os: ubuntu-latest
            android: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Node >= 26 is required for `node --build-sea` (sidecar packaging).
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: npm install

      # The sidecar must exist before any Rust build: tauri.conf.json lists it
      # under externalBin, and tauri-build/cargo check verify it up front.
      # macOS x64 builds additionally need an x64 SEA base (Rosetta runs it
      # on the arm64 runner for the smoke test).
      - name: Build x64 sidecar (for x64 mac target)
        if: matrix.args == '--target x86_64-apple-darwin'
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          curl -fsSL https://nodejs.org/dist/v26.10.0/node-v26.10.0-darwin-x64.tar.gz -o /tmp/node-x64.tar.gz
          mkdir -p /tmp/node-x64 && tar -xzf /tmp/node-x64.tar.gz -C /tmp/node-x64 --strip-components=1
          TALIA_SEA_NODE=/tmp/node-x64/bin/node TALIA_TARGET_TRIPLE=x86_64-apple-darwin npm run sidecar

      - name: Build sidecar (host target)
        if: matrix.args != '--target x86_64-apple-darwin' && !matrix.android
        run: npm run sidecar

      # build:desktop would re-stage the arm64 sidecar over the x64 one
      # staged above, so plain "npm run build" is substituted to produce
      # dist/ without touching the sidecar.
      - name: Rebuild frontend only (x64 mac)
        if: matrix.args == '--target x86_64-apple-darwin'
        run: |
          sed -i '' 's/"beforeBuildCommand": "npm run build:desktop"/"beforeBuildCommand": "npm run build"/' src-tauri/tauri.conf.json
        shell: bash

      # Android thin-client APK: UI ships in the app, AI runs on your
      # computer (the desktop app or `npm run server`) — connect over WiFi.
      - name: Set up Java
        if: matrix.android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        if: matrix.android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android Rust target
        if: matrix.android
        run: rustup target add aarch64-linux-android

      - name: Install Tauri Android scaffolding
        if: matrix.android
        working-directory: src-tauri
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo tauri android init

      - name: Patch Android project for the Play Store
        if: matrix.android
        run: node scripts/android-play.mjs

      - name: Point Android build at a stub sidecar (client-only build)
        if: matrix.android
        run: |
          # The Android client bundles no sidecar; tauri.conf.json still
          # declares externalBin, so stage a placeholder that satisfies the
          # bundler (it is never shipped or executed on Android).
          node -e "
            const fs=require('fs');
            const p='src-tauri/tauri.conf.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            delete c.bundle.externalBin;
            fs.writeFileSync(p, JSON.stringify(c,null,2));
          "

      # The desktop updater needs a signing key: with `createUpdaterArtifacts`
      # and a pubkey in tauri.conf.json, `tauri build` FAILS when the
      # TAURI_SIGNING_PRIVATE_KEY secret is unset. Android must never carry the
      # updater config at all — the Play Store owns Android updates (the Rust
      # side cfg-excludes the plugin on that target). Degrade gracefully:
      # unsigned desktop installers that still work, no updater — and resume
      # signed builds the moment the secret exists. Runs BEFORE any build step
      # so the Android row is patched in time.
      - name: Strip updater config (always on Android; on desktop only without the signing key)
        # Windows runners default to PowerShell; this script is bash.
        shell: bash
        env:
          # The secrets context isn't readable in step `if:` — map it first.
          HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          IS_ANDROID: ${{ matrix.android }}
        run: |
          if [ "$IS_ANDROID" != "true" ] && [ "$HAS_SIGNING_KEY" = "true" ]; then
            echo "Signing key present — updater artifacts stay enabled."
            exit 0
          fi
          if [ "$IS_ANDROID" = "true" ]; then
            echo "Android is updated via the Play Store — stripping updater config."
          else
            echo "No signing key secret — stripping updater config (unsigned installers)."
          fi
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            delete c.bundle.createUpdaterArtifacts;
            delete c.plugins;
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log('updater config stripped');
          "

      # Sign with the Play App Signing keystore when the secrets are present;
      # unsigned otherwise (the sideload APK still works for testing).
      # `tauri android build` takes --apk / --aab boolean flags (no --bundle).
      # AAB additionally needs a signing keystore, so it's built only when the
      # keystore secrets exist; the sideload APK always builds.
      - name: Build Android APK (+ AAB when a signing keystore is configured)
        if: matrix.android
        working-directory: src-tauri
        shell: bash
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_PATH != '' }}
          TAURI_ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_PATH }}
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEYSTORE_KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
          TAURI_ANDROID_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cargo tauri android build --target aarch64 --apk --aab
          else
            echo "No keystore secret configured — building the sideload APK only."
            echo "(Set ANDROID_KEYSTORE_* secrets to produce the Play Store AAB.)"
            cargo tauri android build --target aarch64 --apk
          fi

      - name: Upload Android APK + AAB to release
        if: matrix.android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -n 1)
          test -n "$APK"
          cp "$APK" "Talia.AI_${VERSION}_aarch64.apk"
          if [ -n "$AAB" ]; then cp "$AAB" "Talia.AI_${VERSION}_aarch64.aab"; fi
          # The release is created in parallel by the desktop rows' tauri-action,
          # which can take far longer than the Android build. Wait up to 30
          # minutes, then FAIL LOUDLY if it never appears — a silent pass here
          # would publish a release missing its Android artifact.
          uploaded=""
          for attempt in $(seq 1 60); do
            if gh release upload "$GITHUB_REF_NAME" "Talia.AI_${VERSION}_aarch64.apk" --repo "$GITHUB_REPOSITORY" --clobber; then
              if [ -n "$AAB" ]; then
                gh release upload "$GITHUB_REF_NAME" "Talia.AI_${VERSION}_aarch64.aab" --repo "$GITHUB_REPOSITORY" --clobber || true
              fi
              uploaded=1
              break
            fi
            echo "Release not published yet (attempt $attempt) — waiting…"
            sleep 30
          done
          if [ -z "$uploaded" ]; then
            echo "Release $GITHUB_REF_NAME never appeared — Android artifact NOT uploaded."
            exit 1
          fi

      - name: Build Tauri app
        if: ${{ !matrix.android }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signed self-updates: the updater verifies these against the public
          # key baked into tauri.conf.json before swapping the app.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Talia AI v__VERSION__"
          releaseBody: "Self-hosted AI workstation — runs entirely on your own machines, no drivers. Streaming chat, cross-chat memory, live research, media studio, always-on Dots, and a self-taught engine that learns from your feedback. Auto-updates on desktop; Android ships to the Play Store."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install Linux deps for cargo check
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run sidecar
      - name: Rust check
        working-directory: src-tauri
        run: cargo check

  # tauri-action can only set a fixed releaseBody string, which went stale the
  # moment a release shipped features the string did not mention. The real
  # notes already exist - the annotated tag message, which every release here
  # writes carefully - so after all installers are uploaded, make the release
  # page say the same thing the tag does. Falls back to the fixed body when a
  # tag is lightweight and therefore has no annotation to read.
  release-notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Publish release notes from the tag annotation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # actions/checkout materialises the checked-out tag as a LOCAL
          # lightweight tag pointing at the peeled commit, so %(contents)
          # would return the commit message instead of the annotation. Fetch
          # the real tag object before reading it.
          git fetch origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME" --no-tags --force || true  # branch-triggered releases may have no tag object yet -> fallback below
          # Prefer the ANNOTATED tag's message. A branch-triggered release gets
          # a lightweight tag from GitHub's release API, and %(contents) on that
          # is just a commit subject — never publish that as release notes.
          # Fall back to the default body (kept in sync with `releaseBody` on
          # the Build Tauri app step) so this job is SELF-HEALING: every run
          # leaves the release with the intended text instead of whatever an
          # earlier run wrote.
          DEFAULT_BODY="Self-hosted AI workstation — runs entirely on your own machines, no drivers. Streaming chat, cross-chat memory, live research, media studio, always-on Dots, and a self-taught engine that learns from your feedback. Auto-updates on desktop; Android ships to the Play Store."
          NOTES=""
          if [ "$(git cat-file -t "$GITHUB_REF_NAME" 2>/dev/null)" = "tag" ]; then
            NOTES=$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")
          else
            echo "Tag $GITHUB_REF_NAME is missing or lightweight - will use the default notes."
          fi
          if [ -z "$NOTES" ]; then
            NOTES="$DEFAULT_BODY"
          fi
          gh release edit "$GITHUB_REF_NAME" --notes "$NOTES"
