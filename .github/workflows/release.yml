name: Desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: "--bundles appimage,deb,rpm"
          - os: windows-latest
            args: "--bundles nsis,msi"
          - os: ubuntu-latest
            android: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Node >= 26 is required for `node --build-sea` (sidecar packaging).
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.os, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Install frontend dependencies
        run: npm install

      # macOS x64 builds: the SEA sidecar must be an x64 binary. Download the
      # x64 Node build as the SEA base and enable Rosetta to run/smoke-test it
      # on the arm64 runner.
      - name: Build x64 sidecar (for x64 mac target)
        if: matrix.args == '--target x86_64-apple-darwin'
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          curl -fsSL https://nodejs.org/dist/v26.10.0/node-v26.10.0-darwin-x64.tar.gz -o /tmp/node-x64.tar.gz
          mkdir -p /tmp/node-x64 && tar -xzf /tmp/node-x64.tar.gz -C /tmp/node-x64 --strip-components=1
          TALIA_SEA_NODE=/tmp/node-x64/bin/node npm run sidecar

      # Android thin-client APK: UI ships in the app, AI runs on your
      # computer (the desktop app or `npm run server`) — connect over WiFi.
      - name: Set up Java
        if: matrix.android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        if: matrix.android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install Android Rust target
        if: matrix.android
        run: rustup target add aarch64-linux-android

      - name: Install Tauri Android scaffolding
        if: matrix.android
        working-directory: src-tauri
        run: |
          cargo install tauri-cli --version '^2' --locked
          cargo tauri android init || true

      - name: Build Android APK
        if: matrix.android
        working-directory: src-tauri
        env:
          TAURI_ANDROID_KEYSTORE_PATH: ''
        run: cargo tauri android build --target aarch64 --apk

      - name: Upload Android APK to release
        if: matrix.android
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK"
          VERSION=$(node -p "require('./package.json').version")
          cp "$APK" "Talia.AI_${VERSION}_aarch64.apk"
          gh release upload "$GITHUB_REF_NAME" "Talia.AI_${VERSION}_aarch64.apk" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Build Tauri app
        if: ${{ !matrix.android }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Talia AI v__VERSION__"
          releaseBody: "Cozy local LLM chat companion — cross-chat memory, research, media studio, bots & skills. Desktop runs everything locally; the Android app is a client for your computer's Talia server."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install Linux deps for cargo check
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Rust check
        working-directory: src-tauri
        run: cargo check
