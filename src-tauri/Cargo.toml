[package]
name = "talia-ai"
version = "0.11.2"
description = "Talia AI — an adorably cozy local LLM chat companion. All data stays on your machine."
authors = ["Talia"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "talia_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only plugin (no mobile `init`); excluded from Android/iOS builds.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
